<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 280px;
      padding: 16px;
      background: #1a1a2e;
      color: #fff;
    }
    h2 {
      margin: 0 0 12px;
      font-size: 15px;
      color: #ff5500;
    }
    label {
      font-size: 12px;
      color: #aaa;
      display: block;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #2a2a3e;
      color: #fff;
      font-size: 12px;
      box-sizing: border-box;
    }
    button {
      margin-top: 10px;
      width: 100%;
      padding: 8px;
      background: #ff5500;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { background: #e04d00; }
    #status {
      margin-top: 8px;
      font-size: 12px;
      color: #4caf50;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2>FACEIT Rating Badge</h2>
  <label>Paste your FACEIT API key below:</label>
  <input type="text" id="apiKey" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" />
  <button id="save">Save API Key</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
